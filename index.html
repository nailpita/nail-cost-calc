<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネイル原価計算</title>
<style>
:root{
--bg:#F6F4F1; --surface:#FFFFFF; --ink:#2B2320; --soft:#6B6058; --line:#E6E0D8;
--accent:#B85C7A; --accent-ink:#7C3A50; --accent-soft:#F3E3E8;
--ok:#4F7A4B; --ok-soft:#EAF1E7; --warn:#B4632F; --warn-soft:#FBEAE0; --bad:#B23A3A; --bad-soft:#F8E4E4;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding:16px 14px 70px;}
.wrap{max-width:720px;margin:0 auto;}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px;}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-ink);margin:0 0 2px;}
h1{font-size:21px;font-weight:700;margin:0;}
#status{font-size:11.5px;color:var(--soft);text-align:right;min-height:18px;margin:0 0 4px;}
#status.bad{color:var(--warn);}

.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 0 10px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:10px;padding:9px 13px;flex:1 0 auto;white-space:nowrap;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 10px;}
.card h3{font-size:13.5px;margin:14px 0 6px;color:var(--accent-ink);}
.hint{font-size:12px;color:var(--soft);margin:4px 0 0;}
.note{font-size:12px;color:var(--soft);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn:active{background:var(--accent-ink);}
.btn.secondary{background:var(--surface);color:var(--accent-ink);border:1.5px solid var(--accent);}
.btn.ghost{background:none;color:var(--soft);border:1px solid var(--line);}
.btn.danger{background:var(--bad);}
.btn.dangerOutline{background:var(--surface);color:var(--bad);border:1.5px solid var(--bad);}
.btn.small{padding:7px 11px;font-size:13px;}
.btn.full{width:100%;}

input[type=text],input[type=date],select{width:100%;font-family:inherit;font-size:16px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
label.f{display:block;font-size:12.5px;color:var(--soft);margin-bottom:11px;}
label.f>span.l{display:block;margin-bottom:4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sfx{display:flex;align-items:center;gap:6px;}
.sfx span{font-size:13px;color:var(--soft);white-space:nowrap;}

.msg{border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px;}
.msg.warn{background:var(--warn-soft);color:var(--warn);}
.msg.ok{background:var(--ok-soft);color:var(--ok);}
.msg.bad{background:var(--bad-soft);color:var(--bad);}
.hidden{display:none !important;}

.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;}
.chip.good{background:var(--ok-soft);color:var(--ok);}
.chip.mid{background:var(--warn-soft);color:var(--warn);}
.chip.bad{background:var(--bad-soft);color:var(--bad);}

.tblwrap{overflow-x:auto;}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;}
table.cmp th{font-size:11.5px;color:var(--soft);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;}
table.cmp td:first-child{white-space:normal;min-width:110px;}
table.cmp td{white-space:nowrap;padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;}
table.cmp tr:last-child td{border-bottom:none;}
table.cmp .sub{display:block;font-size:11.5px;color:var(--soft);}

.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--soft);}
.kv.strong{font-weight:700;}
.kv.strong .k{color:var(--ink);}
.neg{color:var(--bad);}
.pos{color:var(--ok);}
details.menuDetail{border-top:1px solid var(--line);padding:10px 0 2px;}
details.menuDetail:first-of-type{border-top:none;}
details.menuDetail>summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;}
details.menuDetail>summary::-webkit-details-marker{display:none;}
details.menuDetail>summary::after{content:'▾';color:var(--soft);}
details.menuDetail[open]>summary::after{content:'▴';}

.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;padding:8px;background:var(--bg);border-radius:10px;}
.line select{flex:1 1 100%;}
.line .amt{flex:0 0 96px;}
.line .info{flex:1 1 80px;font-size:12px;color:var(--soft);}
.live{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0 12px;}
.rowActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.empty{text-align:center;color:var(--soft);font-size:13.5px;padding:22px 10px;}
.steps{margin:6px 0 12px;padding-left:20px;font-size:13.5px;}
.steps li{margin-bottom:4px;}
footer{font-size:11.5px;color:var(--soft);margin-top:18px;text-align:center;}
.radioRow{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:6px;}
.radioRow label{display:flex;align-items:center;gap:6px;}
.radioRow input{width:auto;}

/* 棚卸 */
.stkItem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.stkItem .nm{font-weight:700;font-size:15px;}
.stkItem .pr{font-size:12px;color:var(--soft);}
.stkRow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.stkRow .lb{flex:0 0 64px;font-size:13px;color:var(--soft);}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent-ink);font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;}
.stepper input{width:64px;text-align:center;font-size:18px;font-weight:700;padding:8px 4px;}
.frac button{min-width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
.stkSub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;}
.stkBar{position:sticky;bottom:0;z-index:6;background:var(--accent-ink);color:#fff;border-radius:14px 14px 0 0;padding:12px 16px;margin:0 -2px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.12);}
.stkBar .t{font-size:12px;opacity:.85;}
.stkBar .v{font-size:20px;font-weight:700;}
.stkList{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.stkList:last-child{border-bottom:none;}
input[readonly]{background:var(--surface);color:var(--soft);}
.modalBack{position:fixed;inset:0;background:rgba(43,35,32,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modalBox{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modalBox h2{font-size:17px;margin:0 0 8px;}
.modalBox p{font-size:13.5px;margin:0 0 14px;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
<header>
<div>
<p class="eyebrow">ネイルサロン向け</p>
<h1>ネイル原価計算</h1>
</div>
</header>
<p id="status"></p>

<nav class="tabs" id="tabs">
<button data-tab="result">結果</button>
<button data-tab="menu">メニュー</button>
<button data-tab="mat">材料</button>
<button data-tab="stock">棚卸</button>
<button data-tab="exp">出費</button>
<button data-tab="price">価格</button>
<button data-tab="coupon">回数券</button>
<button data-tab="set">設定</button>
</nav>

<div id="msgArea"></div>
<main id="view"></main>

<footer>
計算結果は、入力した数字にもとづく目安です。税務・会計の判断は、税理士または税務署にご確認ください。<br>
入力したデータは、この端末のブラウザ内にのみ保存され、外部には送信されません。
</footer>
</div>

<div class="modalBack hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modalBox">
<h2 id="modalTitle"></h2>
<p id="modalBody"></p>
<div class="grid2">
<button class="btn secondary" id="modalCancel">キャンセル</button>
<button class="btn danger" id="modalOk">OK</button>
</div>
</div>
</div>

<script>
'use strict';
// ================= 基本 =================
const KEY = 'nailCostCalc_v1';
const $ = (s, r)=> (r||document).querySelector(s);
const $$ = (s, r)=> Array.from((r||document).querySelectorAll(s));

function esc(s){
return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 全角数字・カンマ・単位つきでも読み取る。数でないものは0、負の数は0、極端に大きい数は上限で止める
function parseNum(v){
if(typeof v==='number') return isFinite(v) ? Math.min(Math.max(v,0),1e9) : 0;
let s = String(v==null?'':v)
.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
.replace(/[．。]/g,'.').replace(/[,，、\s円%％]/g,'');
const n = parseFloat(s);
return isFinite(n) ? Math.min(Math.max(n,0),1e9) : 0;
}
function fmtN(n){ return String(Number((+n).toFixed(2))); }
function yen(n){
const r = Math.round(n);
return (r<0?'-':'') + Math.abs(r).toLocaleString('ja-JP') + '円';
}
function pct(x){ return (x*100).toFixed(1).replace(/\.0$/,'') + '%'; }
const EX_GROUPS = [
{id:'rent', kind:'fixed', name:'家賃・共益費', hint:'店舗の賃料・共益費・管理費など(自宅サロンは按分した額)', items:['家賃','共益費・管理費']},
{id:'util', kind:'fixed', name:'水道光熱費', hint:'電気・水道・ガス', items:['電気代','水道代','ガス代']},
{id:'comm', kind:'fixed', name:'通信費', hint:'携帯電話・Wi-Fi・固定電話', items:['サロン用携帯電話','Wi-Fi回線','固定電話']},
{id:'ad', kind:'fixed', name:'予約・集客・広告宣伝費', hint:'予約ポータル掲載料、LINE公式、ホームページ、ドメイン代など', items:['予約ポータル掲載料','LINE公式アカウント','ホームページ・ドメイン代']},
{id:'pay', kind:'fixed', name:'決済端末・システム利用料', hint:'決済端末の月額利用料や回線代(売上にかかる決済手数料%は「設定」)', items:['決済端末の月額利用料','決済端末の回線代']},
{id:'tool', kind:'fixed', name:'ツール・サービス月額費', hint:'会計ソフト、防犯カメラ、BGMなど', items:['会計ソフト','防犯カメラ','BGM(USENなど)']},
{id:'staff', kind:'fixed', name:'人件費(スタッフ雇用時)', hint:'従業員の固定給・社会保険料。自分の時給は「設定」で入れるのでここには入れません', items:['スタッフの基本給','社会保険料']},
{id:'fee', kind:'fixed', name:'顧問料・委託費', hint:'税理士・社労士などの月額顧問料', items:['税理士の顧問料','社労士の顧問料']},
{id:'ins', kind:'fixed', name:'損害保険料', hint:'火災保険・損害賠償責任保険(年払いは「年」を選ぶ)', items:['火災保険','損害賠償責任保険']},
{id:'otherfix', kind:'fixed', name:'その他の固定費', hint:'上のどれにも入らない毎月の固定費', items:[]},
{id:'mat', kind:'supply', name:'施術用材料・薬剤', hint:'ジェル・溶剤・アート資材。メニューごとの材料費は「材料」タブで計上済みのため、初期設定では価格計算に含めません(出費の見える化用)', items:['ジェル類(ベース・トップ・カラー)','溶剤・液剤(アセトン・クリーナー・プライマー)','アート資材(パーツ・ストーン・ホイル・ラメ)']},
{id:'tools', kind:'supply', name:'施術用道具・消耗品', hint:'研磨用品・拭き取り・保護衛生用品・ケア用品', items:['研磨用品(エメリー・ファイル・バッファー)','拭き取り・オフ用品(コットン・ワイプ)','保護・衛生用品(シート・グローブ)','ケア用品(オイル・ハンドクリーム)']},
{id:'hyg', kind:'supply', name:'衛生管理・消毒', hint:'手指・機器の消毒、除菌シートなど', items:['手指消毒液','機器消毒液','除菌シート']},
{id:'daily', kind:'supply', name:'店舗日用品', hint:'ペーパータオル・ティッシュ・ゴミ袋・おしぼり・掃除用具', items:['ペーパータオル・ティッシュ','ゴミ袋','おしぼり','掃除用具']},
{id:'service', kind:'supply', name:'サービス用品', hint:'お客様用のお茶・水・使い捨てスリッパなど', items:['お客様用ドリンク','使い捨てスリッパ']},
{id:'othersup', kind:'supply', name:'その他の消耗品', hint:'上のどれにも入らない消耗品', items:[]}
];
const EX_IDS = EX_GROUPS.map(g=>g.id);
function exMonthly(e){ return e.per==='y' ? e.amount/12 : e.amount; }
function exIncluded(gid){ return !S.exOff.includes(gid); }
function exGroupSum(gid, useGoal){ return S.expenses.filter(e=>e.group===gid).reduce((a,e)=>a + (useGoal && e.goal!=null ? exMonthly({amount:e.goal,per:e.per}) : exMonthly(e)), 0); }
function feeRate(){ return S.settings.payMode==='cash' ? 0 : S.settings.fee; }
function fixedTotal(){ return EX_IDS.reduce((a,g)=> a + (exIncluded(g) ? exGroupSum(g) : 0), 0); }
function rentMonthly(){ return exIncluded('rent') ? exGroupSum('rent') : 0; }
function roundUnit(){ return [10,50,100,500,1000].includes(S.settings.round) ? S.settings.round : 100; }
function ceilTo(n, unit){ return Math.ceil(n/unit - 1e-9) * unit; }
function strOf(n){ return n ? String(n) : ''; }

// ================= 状態 =================
function defaultState(){
return { settings:{hourly:0, round:100, hours:0, payMode:'card', fee:0, place:0, tax:'none', taxRate:10, margin:30, costMax:20},
materials:[], menus:[], coupons:[], idc:1, trial:{cost:0, minutes:0}, expenses:[], exOff:['mat'], hideGuide:false, stocks:[] };
}
let S = defaultState();
let tab = 'result';
let stkSel = null; // 開いている棚卸のID(画面だけの状態)
let storageOK = true;
let dirty = false;
let saveTimer = null;

// ================= 計算 =================
function recUsage(m, r){ return r.count>0 && m.qty>0 ? m.qty*(r.bottles||1)/r.count : null; }
function recAvg(m){
const rs = (m.records||[]).filter(r=>r.count>0);
const persons = rs.reduce((a,r)=>a+r.count,0);
if(!persons || !(m.qty>0)) return null;
return rs.reduce((a,r)=>a+m.qty*(r.bottles||1),0)/persons;
}
function recDays(r){
if(!r.start || !r.end) return null;
const d = (Date.parse(r.end)-Date.parse(r.start))/86400000;
return isFinite(d) && d>=0 ? Math.round(d)+1 : null;
}
function matAvg(m){ return m.samples && m.samples.length ? m.samples.reduce((a,b)=>a+b,0)/m.samples.length : null; }
function matSuggestLabel(m){ return recAvg(m)!=null ? '使い切り記録の平均' : (matAvg(m)!=null ? '実測平均' : '目安'); }
function matSuggest(m){ const ra = recAvg(m); if(ra!=null) return Math.round(ra*1000)/1000; const a = matAvg(m); if(a!=null) return Math.round(a*1000)/1000; return m.guide>0 ? m.guide : null; }
function unitCost(m){ return m.qty>0 ? m.price/m.qty : 0; }

function calcMenu(menu, priceOverride){
const s = S.settings;
const price = priceOverride!=null ? priceOverride : menu.price;
const matMap = new Map(S.materials.map(x=>[x.id,x]));
let matRaw = 0;
menu.lines.forEach(l=>{ const m = matMap.get(l.matId); if(m) matRaw += l.amount * unitCost(m); });
const k = s.tax==='excl' ? 1 + s.taxRate/100 : 1;
const f1 = feeRate()/100, f2 = s.place/100, f = f1 + f2;
const net = Math.round(price / k);
const mat = Math.round(matRaw);
const other = Math.round(menu.other);
const feeCard = Math.round(price * f1);
const feePlace = Math.round(price * f2);
const hours = menu.minutes / 60;
const fixedPH = s.hours>0 ? fixedTotal() / s.hours : 0;
const labor = Math.round(hours * s.hourly);
const fixed = Math.round(hours * fixedPH);
const gross = net - mat - other - feeCard - feePlace;
const profit = gross - labor - fixed;
const C = mat + other + labor + fixed;
const m = Math.min(Math.max(s.margin,0),95)/100;
const d0 = 1/k - f, dt = (1-m)/k - f;
const pBreak = d0>0 ? C/d0 : null;
const pTarget = dt>0 ? C/dt : null;
return { price, net, mat, other, feeCard, feePlace, hours, labor, fixed, gross, profit,
rate: net>0 ? profit/net : null,
costRate: net>0 ? (mat+other)/net : null,
grossPH: hours>0 ? gross/hours : null,
pBreak, pTarget,
pBreakUp: pBreak==null ? null : ceilTo(pBreak,roundUnit()),
pTargetUp: pTarget==null ? null : ceilTo(pTarget,roundUnit()) };
}
function judge(r){
if(!(r.price>0)) return {cls:'mid', txt:'価格未入力'};
if(r.profit<0) return {cls:'bad', txt:'赤字'};
if(r.net>0 && (r.profit/r.net)*100 >= S.settings.margin - 1e-9) return {cls:'good', txt:'目標達成'};
return {cls:'mid', txt:'目標未満'};
}
function requiredPH(){
const s = S.settings;
return s.hourly + (s.hours>0 ? fixedTotal()/s.hours : 0);
}

// ================= 保存 =================
function setStatus(t, bad){ const el=$('#status'); el.textContent=t; el.classList.toggle('bad', !!bad); }
function timeLabel(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function saveNow(){
clearTimeout(saveTimer); saveTimer = null;
try{
localStorage.setItem(KEY, JSON.stringify(S));
storageOK = true; dirty = false;
setStatus(`✓ 自動保存しました(${timeLabel()})`);
}catch(err){
storageOK = false;
setStatus('⚠ 自動保存できません。「設定」→「バックアップを保存」で保存してください', true);
}
}
function touch(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
window.addEventListener('pagehide', ()=>{ if(saveTimer) saveNow(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && saveTimer) saveNow(); });
window.addEventListener('beforeunload', (e)=>{ if(dirty && !storageOK){ e.preventDefault(); e.returnValue=''; } });

// 読み込んだデータの検査・整形
function sanitize(d){
if(!d || typeof d!=='object' || Array.isArray(d)) throw new Error('invalid');
if(!(d.settings && typeof d.settings==='object') || !Array.isArray(d.materials) || !Array.isArray(d.menus)) throw new Error('invalid');
const str = (x,n)=> typeof x==='string' ? x.slice(0,n||60) : '';
const clamp = (x,a,b)=> Math.min(Math.max(x,a),b);
const st = d.settings && typeof d.settings==='object' ? d.settings : {};
const settings = {
hourly: parseNum(st.hourly), round: [10,50,100,500,1000].includes(parseNum(st.round)) ? parseNum(st.round) : 100, hours: clamp(parseNum(st.hours),0,744),
payMode: st.payMode==='cash' ? 'cash' : 'card', fee: clamp(parseNum(st.fee),0,100), place: clamp(parseNum(st.place),0,100),
tax: st.tax==='excl' ? 'excl' : 'none',
taxRate: clamp(parseNum(st.taxRate)||10,0,100),
margin: clamp(st.margin==null ? 30 : parseNum(st.margin),0,95),
costMax: st.costMax==null ? 20 : clamp(parseNum(st.costMax)||20,1,100) };
const ids = new Set();
const okId = (x)=> Number.isInteger(x) && x>0 && !ids.has(x);
const materials = [];
(Array.isArray(d.materials)?d.materials:[]).slice(0,500).forEach(m=>{
if(m && okId(m.id)){ ids.add(m.id); materials.push({id:m.id, name:str(m.name), price:parseNum(m.price), qty:parseNum(m.qty), unit:str(m.unit,10), guide:parseNum(m.guide), records:(Array.isArray(m.records)?m.records:[]).slice(0,50).map(r=>({start:/^\d{4}-\d{2}-\d{2}$/.test(r&&r.start)?r.start:'', end:/^\d{4}-\d{2}-\d{2}$/.test(r&&r.end)?r.end:'', count:Math.round(parseNum(r&&r.count)), bottles:parseNum(r&&r.bottles)||1})), samples:(Array.isArray(m.samples)?m.samples:[]).slice(0,50).map(parseNum).filter(x=>x>0)}); }
});
const matIds = new Set(materials.map(m=>m.id));
const menus = [];
(Array.isArray(d.menus)?d.menus:[]).slice(0,500).forEach(m=>{
if(m && okId(m.id)){
ids.add(m.id);
const lines = [];
(Array.isArray(m.lines)?m.lines:[]).slice(0,100).forEach(l=>{
if(l && matIds.has(l.matId)){
const ex = lines.find(x=>x.matId===l.matId);
if(ex) ex.amount += parseNum(l.amount); else lines.push({matId:l.matId, amount:parseNum(l.amount)});
}
});
menus.push({id:m.id, market:parseNum(m.market), name:str(m.name), price:parseNum(m.price), minutes:clamp(parseNum(m.minutes),0,1440), other:parseNum(m.other), count:parseNum(m.count), lines});
}
});
const menuIds = new Set(menus.map(m=>m.id));
const coupons = [];
(Array.isArray(d.coupons)?d.coupons:[]).slice(0,500).forEach(c=>{
if(c && okId(c.id) && menuIds.has(c.menuId)){
ids.add(c.id);
coupons.push({id:c.id, name:str(c.name), menuId:c.menuId, sessions:clamp(Math.round(parseNum(c.sessions))||1,1,100), price:parseNum(c.price)});
}
});
const expenses = [];
(Array.isArray(d.expenses)?d.expenses:[]).slice(0,1000).forEach(e=>{
if(e && okId(e.id) && EX_IDS.includes(e.group)){
ids.add(e.id);
expenses.push({id:e.id, group:e.group, name:str(e.name), amount:parseNum(e.amount), per:e.per==='y'?'y':'m', goal:(e.goal==null||e.goal==='')?null:parseNum(e.goal)});
}
});
const exOff = Array.isArray(d.exOff) ? d.exOff.filter(g=>EX_IDS.includes(g)) : ['mat'];
let mig = 0;
if(!Array.isArray(d.expenses)){
const r0 = parseNum(st.rent), f0 = parseNum(st.fixed);
const base = Math.max(0, ...Array.from(ids)) + 1;
if(r0>0){ expenses.push({id:base+mig, group:'rent', name:'賃料(以前の入力)', amount:r0, per:'m', goal:null}); mig++; }
if(f0>0){ expenses.push({id:base+mig, group:'otherfix', name:'その他の固定費(以前の入力)', amount:f0, per:'m', goal:null}); mig++; }
}
const stocks = [];
(Array.isArray(d.stocks)?d.stocks:[]).slice(0,200).forEach(t=>{
if(t && okId(t.id) && /^\d{4}-\d{2}-\d{2}$/.test(t.date)){
ids.add(t.id);
const seen = new Set();
const items = (Array.isArray(t.items)?t.items:[]).slice(0,500).filter(it=>it && Number.isInteger(it.matId) && !seen.has(it.matId) && seen.add(it.matId)).map(it=>({matId:it.matId, sealed:clamp(Math.round(parseNum(it.sealed)),0,9999), open:clamp(Math.round(parseNum(it.open)*100)/100,0,999), name:str(it.name), price:parseNum(it.price), qty:parseNum(it.qty), unit:str(it.unit,10)}));
stocks.push({id:t.id, date:t.date, locked:t.locked===true, items});
}
});
let maxId = 0; ids.forEach(i=>{ if(i>maxId) maxId=i; }); expenses.forEach(e=>{ if(e.id>maxId) maxId=e.id; });
const idc = Math.max(maxId+1, Number.isInteger(d.idc) ? d.idc : 1);
const tr = d.trial && typeof d.trial==='object' ? d.trial : {};
const trial = {cost:parseNum(tr.cost), minutes:clamp(parseNum(tr.minutes),0,1440)};
return {settings, materials, menus, coupons, idc, trial, expenses, exOff, hideGuide: d.hideGuide===true, stocks};
}
function hasData(){ return S.materials.length || S.menus.length || S.coupons.length || S.stocks.length; }

// ================= 画面:棚卸 =================
// 金額 = (未開封の本数 + 使いかけの本数) × 1本(1パック)あたりの購入金額(最後に買った金額)
function stkRows(t){
if(t.locked) return t.items.map(it=>({matId:it.matId, name:it.name, price:it.price, qty:it.qty, unit:it.unit, sealed:it.sealed, open:it.open, gone:false}));
return S.materials.map(m=>{ const it = t.items.find(x=>x.matId===m.id) || {sealed:0, open:0}; return {matId:m.id, name:m.name, price:m.price, qty:m.qty, unit:m.unit, sealed:it.sealed, open:it.open}; });
}
function stkCount(r){ return (r.sealed||0) + (r.open||0); }
function stkValue(t){ return stkRows(t).reduce((a,r)=> a + stkCount(r)*(r.price||0), 0); }
function stkPrev(t){ return S.stocks.filter(x=>x.id!==t.id && x.date < t.date).sort((a,b)=> a.date<b.date?1:-1)[0] || null; }
function stkItem(t, matId){ let it = t.items.find(x=>x.matId===matId); if(!it){ it = {matId, sealed:0, open:0, name:'', price:0, qty:0, unit:''}; t.items.push(it); } return it; }
function fmtB(n){ return fmtN(Math.round(n*100)/100); }
function dateJP(d){ const [y,m,dd] = d.split('-'); return `${+y}年${+m}月${+dd}日`; }
function isYearEnd(d){ return /-12-31$/.test(d); }
function stkBarHtml(t){
const rows = stkRows(t);
const n = rows.reduce((a,r)=>a+stkCount(r),0);
return `<div><div class="t">${dateJP(t.date)}の棚卸 合計${t.locked?'(確定)':''}</div><div class="v">${yen(stkValue(t))}</div></div><div class="t" style="text-align:right;">在庫 ${fmtB(n)}本・個<br>${rows.filter(r=>stkCount(r)>0).length}/${rows.length}品目</div>`;
}
function stkSubHtml(t, r){
const prev = stkPrev(t);
let diff = '';
if(prev){ const pr = stkRows(prev).find(x=>x.matId===r.matId); if(pr){ const d = stkCount(r)-stkCount(pr); diff = `前回 ${fmtB(stkCount(pr))} → ${d===0?'変化なし':(d>0?'+':'')+(d===0?'':fmtB(d))}`; } }
const c = stkCount(r);
const low = c===0 ? '<span class="chip bad">在庫なし</span>' : (r.sealed===0 && r.open<=0.5 ? '<span class="chip mid">残りわずか</span>' : '');
return `<span>${low} <span class="note">${diff}</span></span><b>${yen(c*(r.price||0))}</b>`;
}
function stkShortHtml(t){
const short = stkRows(t).filter(r=>stkCount(r)===0 || (r.sealed===0 && r.open<=0.5));
return short.length ? `<div class="msg warn">0本・残りわずか：${short.map(r=>esc(r.name||'(名前なし)')).join('、')}</div>` : '';
}
function stkCardHtml(t, r){
const ro = t.locked ? 'readonly' : '';
const sid = t.id, mid = r.matId;
return `<div class="stkItem" data-card="stk:${mid}">
<div class="nm">${esc(r.name||'(名前なし)')}</div>
<div class="pr">${r.price>0 ? `1本(1パック) ${yen(r.price)}${r.qty>0?` ／ ${fmtN(r.qty)}${esc(r.unit||'')}`:''}` : '<span class="neg">「材料」タブで購入金額を入れてください</span>'}</div>
<div class="stkRow"><span class="lb">未開封</span><div class="stepper">
${t.locked?'':`<button data-act="stkStep" data-id="${sid}" data-mat="${mid}" data-v="-1" aria-label="未開封を1減らす">−</button>`}
<input type="text" inputmode="numeric" autocomplete="off" data-k="stki" data-id="${sid}" data-mat="${mid}" data-f="sealed" data-num="1" value="${esc(strOf(r.sealed))}" placeholder="0" ${ro} aria-label="未開封の本数">
${t.locked?'':`<button data-act="stkStep" data-id="${sid}" data-mat="${mid}" data-v="1" aria-label="未開封を1増やす">＋</button>`}
</div><span class="note">本・個</span></div>
<div class="stkRow"><span class="lb">使いかけ</span>
<input type="text" inputmode="decimal" autocomplete="off" style="width:72px;text-align:center;font-weight:700;" data-k="stki" data-id="${sid}" data-mat="${mid}" data-f="open" data-num="1" value="${esc(strOf(r.open))}" placeholder="0" ${ro} aria-label="使いかけの本数"><span class="note">本ぶん</span></div>
${t.locked?'':`<div class="stkRow frac" style="margin-top:6px;"><span class="lb"></span>
<button data-act="stkOpen" data-id="${sid}" data-mat="${mid}" data-v="0.25">＋¼</button>
<button data-act="stkOpen" data-id="${sid}" data-mat="${mid}" data-v="0.5">＋½</button>
<button data-act="stkOpen" data-id="${sid}" data-mat="${mid}" data-v="0.75">＋¾</button>
<button data-act="stkOpen" data-id="${sid}" data-mat="${mid}" data-v="0">0に戻す</button></div>`}
<div class="stkSub" data-live="stki:${sid}:${mid}">${stkSubHtml(t,r)}</div>
</div>`;
}
function stkTaxHtml(){
const ends = S.stocks.filter(t=>isYearEnd(t.date)).sort((a,b)=> a.date<b.date?1:-1);
let h = `<div class="card"><h2>確定申告での使い方</h2>`;
if(ends.length){
h += ends.slice(0,3).map(t=>kv(`${t.date.slice(0,4)}年末(12月31日)の棚卸高${t.locked?'':'<span class="note">　入力中</span>'}`, yen(stkValue(t)), '', true)).join('');
h += `<p class="hint">その年の決算書では「期末商品(製品)棚卸高」、翌年の決算書では「期首商品(製品)棚卸高」に使う金額です。</p>`;
} else {
h += `<p class="hint" style="margin:0 0 8px;">12月31日の日付で棚卸をすると、ここに年末の棚卸金額が出ます。</p>`;
}
h += `<details><summary style="cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:600;">くわしい説明を読む</summary>
<ul class="steps" style="margin-top:8px;">
<li>年末に残っている材料の金額は、その年の経費から差し引きます。決算書では <b>売上原価 = 期首の棚卸高 ＋ その年の仕入 − 期末の棚卸高</b> で計算します。</li>
<li>このアプリの金額は「最後に買ったときの金額 × 残っている量」です(最終仕入原価法)。評価方法を税務署に届け出ていない個人事業主は、通常この方法になります。</li>
<li>毎年ほぼ同じ量を買って続けて使う消耗品は、買った年の経費にし続けていれば、棚卸に入れない扱いも認められています(所得税基本通達37-30の3)。どちらにするかは、税理士または税務署に確認してください。</li>
<li>確定した棚卸は、あとから材料の金額を変えても変わりません。12月31日の棚卸は「確定する」を押しておくと安心です。</li>
</ul></details></div>`;
return h;
}
function renderStock(){
let h = '';
const t = S.stocks.find(x=>x.id===stkSel);
if(t){
h += `<div class="card">
<div class="rowActions" style="margin:0 0 10px;"><button class="btn ghost small" data-act="stkClose">← 棚卸の一覧へ</button></div>
<label class="f"><span class="l">棚卸の日付</span><input type="date" data-k="stk" data-id="${t.id}" data-f="date" value="${esc(t.date)}" ${t.locked?'readonly':''}></label>
${t.locked ? '<div class="msg ok" style="margin:0;">確定済みです。金額は確定したときの購入金額で固定されています。</div>' : '<p class="hint" style="margin:0;">棚やワゴンの前で、上から順に数を入れていきます。未開封は＋−、使いかけは「＋½」などのボタンで足していきます。</p>'}
</div>`;
const rows = stkRows(t);
if(!rows.length) h += `<div class="empty">材料がまだありません。<br><button class="btn secondary small" style="margin-top:10px;" data-act="goTab" data-t="mat">材料を登録する</button></div>`;
if(rows.length && !t.locked) h += `<div data-live="stkshort:${t.id}">${stkShortHtml(t)}</div>`;
h += rows.map(r=>stkCardHtml(t,r)).join('');
h += `<div class="card" style="margin-top:4px;"><div class="grid2">
${t.locked ? `<button class="btn secondary" data-act="stkUnlock" data-id="${t.id}">確定を解除</button>` : `<button class="btn" data-act="stkLock" data-id="${t.id}">この棚卸を確定する</button>`}
<button class="btn secondary" data-act="stkCsv" data-id="${t.id}">CSVで保存</button>
</div>
<div style="margin-top:10px;"><button class="btn dangerOutline small" data-act="stkDel" data-id="${t.id}">この棚卸を削除</button></div></div>`;
h += `<div class="stkBar" data-live="stkbar:${t.id}">${stkBarHtml(t)}</div>`;
return h;
}
const y = new Date().getFullYear(), mo = new Date().getMonth()+1;
const yeDate = `${mo<=3 ? y-1 : y}-12-31`;
h += `<div class="card"><h2>棚卸</h2>
<p class="hint" style="margin:0 0 12px;">「材料」タブに入れた材料が、そのまま棚卸の一覧になります。数を入れると、残っている材料の金額が自動で出ます。月末の在庫チェックにも、年末(12月31日)の確定申告にも使えます。</p>
<button class="btn full" data-act="stkNew" data-d="${todayStr()}">今日の日付で棚卸をはじめる</button>
<button class="btn secondary full" style="margin-top:8px;" data-act="stkNew" data-d="${yeDate}">${yeDate.slice(0,4)}年12月31日の棚卸をはじめる</button>
${S.materials.length?'':'<p class="hint">先に「材料」タブで材料を登録してください。</p>'}
</div>`;
const list = S.stocks.slice().sort((a,b)=> a.date<b.date?1:-1);
h += `<div class="card"><h2>これまでの棚卸</h2>`;
h += list.length ? list.map(t=>`<div class="stkList"><div><b>${dateJP(t.date)}</b> ${t.locked?'<span class="chip good">確定</span>':'<span class="chip mid">入力中</span>'}<div class="note">${yen(stkValue(t))}</div></div><button class="btn secondary small" data-act="stkOpenT" data-id="${t.id}">開く</button></div>`).join('') : '<div class="empty" style="padding:10px;">まだ棚卸の記録はありません。</div>';
h += `</div>`;
h += stkTaxHtml();
return h;
}
function stkCsv(t){
const q = v=> `"${String(v).replace(/"/g,'""')}"`;
const lines = [['棚卸日','材料名','単位','容量','1本(1パック)の購入金額','未開封','使いかけ','合計(本・個)','金額'].map(q).join(',')];
stkRows(t).forEach(r=>{ const c = stkCount(r); lines.push([t.date, r.name, r.unit, r.qty, r.price, r.sealed, r.open, fmtB(c), Math.round(c*(r.price||0))].map(q).join(',')); });
lines.push([t.date,'合計','','','','','','',Math.round(stkValue(t))].map(q).join(','));
const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a'); a.href = url; a.download = `棚卸_${t.date}.csv`;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url), 1000);
}


// ================= 画面:出費 =================
function exGroupHtml(gid){
  const g = EX_GROUPS.find(x=>x.id===gid);
  const n = S.expenses.filter(e=>e.group===gid).length;
  const sum = exGroupSum(gid), goal = exGroupSum(gid, true);
  return `小計 <b>${yen(sum)}</b> / 月(年 ${yen(sum*12)})${n && goal<sum-0.5 ? `<br>見直し後 <b class="pos">${yen(goal)}</b> / 月(<b class="pos">${yen(sum-goal)}</b> 削減)` : ''}`;
}
function exSummaryHtml(){
  const s = S.settings;
  const all = EX_GROUPS.map(g=>({g, v:exGroupSum(g.id), goal:exGroupSum(g.id,true)}));
  const total = all.reduce((a,x)=>a+x.v,0);
  const incl = fixedTotal();
  const goalTotal = all.reduce((a,x)=>a+x.goal,0);
  const save = total - goalTotal;
  if(total<=0) return `<p class="hint" style="margin:0;">項目を入力すると、ここに合計と内訳が出ます。</p>`;
  const rows = all.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  let h = `${kv('月の出費の合計', yen(total), '', true)}
${kv('年間の合計', yen(total*12))}
${kv('うち価格計算に含める分(月)', yen(incl))}
${s.hours>0 ? kv('施術1時間あたり(価格計算分)', yen(incl/s.hours)) : ''}`;
  let sales = 0; S.menus.forEach(m=>{ sales += m.price*m.count; });
  if(sales>0) h += kv('月の売上(税込)に対する出費の割合', pct(total/sales));
  h += `<h3>内訳(多い順)</h3>`;
  rows.forEach(x=>{
    const w = Math.max(2, Math.round(x.v/total*100));
    h += `<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:13px;gap:8px;"><span>${esc(x.g.name)}${exIncluded(x.g.id)?'':'<span class="note">(価格計算に含めない)</span>'}</span><span>${yen(x.v)}・${pct(x.v/total)}</span></div>
<div style="height:7px;border-radius:4px;background:var(--bg);"><div style="height:7px;border-radius:4px;background:var(--accent);width:${w}%;"></div></div></div>`;
  });
  const items = S.expenses.filter(e=>exMonthly(e)>0).sort((a,b)=>exMonthly(b)-exMonthly(a)).slice(0,5);
  if(items.length){
    h += `<h3>金額の大きい項目 上位${items.length}</h3>` + items.map((e,i)=>kv(`${i+1}. ${esc(e.name||'(名前なし)')}`, yen(exMonthly(e))+' / 月')).join('');
  }
  h += `<h3>見直しの目安</h3>`;
  if(save>0.5){
    const hrBefore = s.hours>0 ? incl/s.hours : null;
    const inclGoal = EX_IDS.reduce((a,g)=> a + (exIncluded(g) ? exGroupSum(g,true) : 0), 0);
    h += `${kv('見直し後の月の出費', yen(goalTotal))}
${kv('1か月の削減額', yen(save), 'pos', true)}
${kv('1年間の削減額', yen(save*12), 'pos', true)}
${hrBefore!=null ? kv('施術1時間あたり(価格計算分)の変化', yen(hrBefore)+' → '+yen(inclGoal/s.hours)) : ''}`;
  } else {
    h += `<p class="hint" style="margin:0;">各項目の「見直し後の金額」を入れると、削減できる額が出ます(例：通信費を3,000円→2,000円に)。</p>`;
  }
  return h;
}

<div style="flex:1 1 100%;">${textInput('ex',e.id,'name',e.name,'項目名')}</div>
<div class="amt" style="flex:1 1 90px;">${numInput('ex',e.id,'amount',e.amount,'金額')}</div>
<select style="flex:0 0 66px;" data-k="ex" data-id="${e.id}" data-f="per"><option value="m"${e.per==='m'?' selected':''}>月</option><option value="y"${e.per==='y'?' selected':''}>年</option></select>
<input type="text" inputmode="decimal" autocomplete="off" style="flex:1 1 110px;" data-k="ex" data-id="${e.id}" data-f="goal" data-num="1" value="${e.goal==null?'':esc(String(e.goal))}" placeholder="見直し後">
<button class="btn ghost small" data-act="delEx" data-id="${e.id}" aria-label="この項目を削除">✕</button>
</div>`;
}

// ================= 画面:価格 =================
function breakdownHtml(menu, price){
  const s = S.settings, r = calcMenu(menu, price);
  const rentShare = s.hours>0 ? Math.min(r.fixed, Math.round(r.hours * rentMonthly() / s.hours)) : 0;
  const otherFixed = r.fixed - rentShare;
  const neg = n => '-'+yen(n).replace(/^-/,'');
  return `${kv('販売価格(税込)', yen(price), '', true)}
${s.tax==='excl' ? kv('消費税', neg(price - r.net)) : ''}
${kv('材料費(購入原価)', neg(r.mat + r.other))}
${kv('決済手数料・場所代', neg(r.feeCard + r.feePlace))}
${kv('賃料の配分', neg(rentShare))}
${kv('その他固定費の配分', neg(otherFixed))}
${kv('自分の人件費', neg(r.labor))}
${kv('手元に残る利益', yen(r.profit), signCls(r.profit), true)}
${kv('利益率(税抜売上比)', r.rate==null?'—':pct(r.rate))}`;
}
function priceBodyHtml(){
  const s = S.settings;
  let h = '';
  const warns = [];
  if(s.hours<=0) warns.push('「設定」の月の施術可能時間が未入力のため、賃料を各メニューに配分できません(賃料0円で計算されます)。');
  if(rentMonthly()<=0) warns.push('「出費」タブの「家賃・共益費」が未入力です(賃料0円で計算されます)。');
  if(s.hourly<=0) warns.push('「設定」の自分の目標時給が未入力です(人件費0円で計算されます)。');
  if(feeRate()+s.place>=100) warns.push('手数料と場所代の合計が100%以上のため、価格を計算できません。');
  if(warns.length) h += `<div class="msg warn">${warns.map(w=>'・'+esc(w)).join('<br>')}</div>`;
  const rentPH = s.hours>0 ? rentMonthly()/s.hours : 0;
  h += `<div class="card"><h2>1時間あたりのコスト</h2>
${kv('賃料の配分', yen(rentPH)+' / 時間')}
${kv('その他固定費の配分', yen(s.hours>0 ? (fixedTotal()-rentMonthly())/s.hours : 0)+' / 時間')}
${kv('自分の人件費(目標時給)', yen(s.hourly)+' / 時間')}
${kv('合計(施術1時間で最低限ほしい額)', yen(requiredPH())+' / 時間', '', true)}
<p class="hint">賃料 ${yen(rentMonthly())} ÷ 月の施術可能時間 ${fmtN(s.hours)}時間。予約が埋まらない時間も含めて割っているので、稼働が少ないほど実際の負担は重くなります。</p></div>`;
  if(!S.menus.length){
    h += `<div class="empty">「メニュー」を登録すると、メニューごとの提案価格が出ます。</div>`;
    return h;
  }
  S.menus.forEach(m=>{
    const r = calcMenu(m);
    h += `<div class="card"><h2>${esc(m.name||'(名前なし)')}<span class="note">　${fmtN(m.minutes)}分</span></h2>`;
    if(r.pTargetUp==null){
      h += `<div class="msg bad">手数料などの合計が大きすぎて、価格を計算できません。</div></div>`;
      return;
    }
    const rows = [['赤字にならない最低価格', r.pBreakUp], [`目標利益率${fmtN(s.margin)}%の提案価格`, r.pTargetUp]];
    if(m.market>0) rows.push(['近隣の相場', m.market]);
    if(m.price>0 && m.price!==m.market) rows.push(['現在の自分の価格', m.price]);
    rows.sort((a,b)=>a[1]-b[1]);
    h += `<div class="live"><div style="font-size:12px;color:var(--soft);">提案価格(利益率${fmtN(s.margin)}%・税込)</div>
<div style="font-size:24px;font-weight:700;color:var(--accent-ink);">${yen(r.pTargetUp)}</div></div>
<div class="tblwrap"><table class="cmp"><thead><tr><th>価格</th><th>1回の利益</th><th>利益率</th><th>判定</th></tr></thead><tbody>
${rows.map(([lb,pr])=>{ const rr = calcMenu(m, pr), j = judge(rr);
return `<tr><td>${yen(pr)}<span class="sub">${esc(lb)}</span></td><td class="${signCls(rr.profit)}">${yen(rr.profit)}</td><td>${rr.rate==null?'—':pct(rr.rate)}</td><td><span class="chip ${j.cls}">${j.txt}</span></td></tr>`; }).join('')}
</tbody></table></div>`;
    const ref = m.market>0 ? m.market : (m.price>0 ? m.price : 0);
    if(ref>0){
      const rr = calcMenu(m, ref), lbl = m.market>0 ? '近隣の相場' : '現在の価格';
      let t = `${lbl}の${yen(ref)}で売ると、1回あたり <b class="${signCls(rr.profit)}">${yen(rr.profit)}</b> ${rr.profit<0 ? 'の赤字です。' : 'の利益です。'}`;
      if(rr.profit<0 && r.pTargetUp!=null) t += `<br>目標を満たすには、あと <b>${yen(Math.max(0, r.pTargetUp-ref))}</b> 高い価格が必要です。相場に合わせる場合は、材料費や時間を見直すか、別メニューの利益で補う必要があります。`;
      const per = rr.gross - rr.labor;
      if(per>0 && fixedTotal()>0){
        const n = Math.ceil(fixedTotal()/per), hrs = n*rr.hours;
        t += `<br>このメニューだけで固定費(月${yen(fixedTotal())})を回収して目標時給も確保するには、月 <b>${n}件</b>(約${fmtN(Math.round(hrs*10)/10)}時間)が必要です${s.hours>0 ? (hrs>s.hours ? '。月の施術可能時間を超えています' : '(施術可能時間の'+pct(hrs/s.hours)+')') : ''}。`;
      } else if(per<=0){
        t += `<br>材料費・手数料・自分の時給を引くと、固定費に回せる額が残りません。`;
      }
      h += `<div class="live" style="margin-top:10px;">${t}</div>`;
    }
    h += `<h3>提案価格の内訳</h3>${breakdownHtml(m, r.pTargetUp)}</div>`;
  });
  return h;
}

// ================= 画面:回数券 =================
function couponCalc(c){
const menu = S.menus.find(m=>m.id===c.menuId);
if(!menu) return null;
const per = c.price / c.sessions;
const r = calcMenu(menu, per);
const normal = menu.price;
return {menu, per, r, discount: normal>0 ? 1 - per/normal : null, total: r.profit * c.sessions,
minTotal: r.pTarget==null ? null : ceilTo(r.pTarget*c.sessions, roundUnit()),
breakTotal: r.pBreak==null ? null : ceilTo(r.pBreak*c.sessions, roundUnit())};
}
function couponLiveHtml(c){
const x = couponCalc(c);
if(!x) return 'メニューを選んでください';
const j = judge(x.r);
return `1回あたり <b>${yen(x.per)}</b>(通常 ${yen(x.menu.price)}${x.discount==null?'':'・'+(x.discount>=0?pct(x.discount)+'引き':pct(-x.discount)+'上乗せ')})<br>
1回あたり利益 <b class="${signCls(x.r.profit)}">${yen(x.r.profit)}</b>(利益率 ${x.r.rate==null?'—':pct(x.r.rate)}) <span class="chip ${j.cls}">${j.txt}</span><br>
全${c.sessions}回の利益 <b class="${signCls(x.total)}">${yen(x.total)}</b><br>
目標利益率${fmtN(S.settings.margin)}%を守れる回数券の価格: <b>${x.minTotal==null?'計算できません':yen(x.minTotal)+'以上'}</b><br>
赤字にならない最低価格: <b>${x.breakTotal==null?'計算できません':yen(x.breakTotal)+'以上'}</b>`;
}

// ================= 描画 =================
function render(){
$$('#tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
const at=$('#tabs button.active'); if(at && at.scrollIntoView){ try{ at.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){} }
$('#view').innerHTML = tab==='result' ? renderResult()
: tab==='menu' ? renderMenu()
: tab==='mat' ? renderMat()
: tab==='stock' ? renderStock()
: tab==='exp' ? renderExp()
: tab==='price' ? renderPrice()
: tab==='coupon' ? renderCoupon()
: renderSet();
}
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0,y); }
function setTab(t){ tab = t; msg('',''); render(); window.scrollTo(0,0); }
$('#tabs').addEventListener('click', (e)=>{ const b = e.target.closest('button[data-tab]'); if(b){ if(b.dataset.tab!=='stock' || tab==='stock') stkSel = null; setTab(b.dataset.tab); } });

function refreshLive(){
$$('[data-live]').forEach(el=>{
const p = el.dataset.live.split(':');
if(p[0]==='menu'){ const m=S.menus.find(x=>x.id===+p[1]); if(m) el.innerHTML = menuLiveHtml(m); }
else if(p[0]==='mat'){ const m=S.materials.find(x=>x.id===+p[1]); if(m) el.innerHTML = matLiveHtml(m); }
else if(p[0]==='line'){ const m=S.menus.find(x=>x.id===+p[1]); const l=m&&m.lines[+p[2]]; if(l) el.innerHTML = lineInfoHtml(l); }
else if(p[0]==='coupon'){ const c=S.coupons.find(x=>x.id===+p[1]); if(c) el.innerHTML = couponLiveHtml(c); }
else if(p[0]==='price'){ el.innerHTML = priceBodyHtml(); }
else if(p[0]==='rec'){ const m=S.materials.find(x=>x.id===+p[1]); const r=m&&m.records[+p[2]]; if(r) el.innerHTML = recRowHtml(m,r); }
else if(p[0]==='recsum'){ const m=S.materials.find(x=>x.id===+p[1]); if(m) el.innerHTML = recSumHtml(m); }
else if(p[0]==='pick'){ const m=S.menus.find(x=>x.id===+p[1]); const l=m&&m.lines.find(x=>x.matId===+p[2]); if(l) el.innerHTML = pickInfoHtml(l); }
else if(p[0]==='exsum'){ el.innerHTML = exSummaryHtml(); }
else if(p[0]==='exg'){ el.innerHTML = exGroupHtml(p[1]); }
else if(p[0]==='trial'){ el.innerHTML = trialHtml(); }
else if(p[0]==='stkshort'){ const t=S.stocks.find(x=>x.id===+p[1]); if(t) el.innerHTML = stkShortHtml(t); }
else if(p[0]==='stkbar'){ const t=S.stocks.find(x=>x.id===+p[1]); if(t) el.innerHTML = stkBarHtml(t); }
else if(p[0]==='stki'){ const t=S.stocks.find(x=>x.id===+p[1]); const r=t&&stkRows(t).find(x=>x.matId===+p[2]); if(r) el.innerHTML = stkSubHtml(t,r); }
});
}

// ================= 入力 =================
function onEdit(e){
const el = e.target;
const k = el.dataset && el.dataset.k;
if(!k) return;
const f = el.dataset.f, id = +el.dataset.id;
const isNum = !!el.dataset.num;
const v = isNum ? parseNum(el.value) : el.value;
if(k==='set'){
const s = S.settings;
if(f==='tax'){
s.tax = el.value==='excl' ? 'excl' : 'none';
const row = $('#taxRateRow'); if(row) row.classList.toggle('hidden', s.tax!=='excl');
} else if(f==='payMode'){
s.payMode = el.value==='cash' ? 'cash' : 'card';
const row = $('#feeRow'); if(row) row.classList.toggle('hidden', s.payMode==='cash');
} else if(f==='hours'){ s.hours = Math.min(v,744); }
else if(f==='fee' || f==='place'){ s[f] = Math.min(v,100); }
else if(f==='margin'){ s.margin = Math.min(v,95); }
else if(f==='costMax'){ s.costMax = v>0 ? Math.min(v,100) : 20; }
else if(f==='round'){ s.round = [10,50,100,500,1000].includes(+el.value) ? +el.value : 100; }
else if(f==='taxRate'){ s.taxRate = Math.min(v,100); }
else if(f in s){ s[f] = v; }
} else if(k==='stk'){
const t = S.stocks.find(x=>x.id===id); if(!t || t.locked) return;
if(f==='date' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)){ t.date = el.value; }
} else if(k==='stki'){
const t = S.stocks.find(x=>x.id===id); if(!t || t.locked) return;
const it = stkItem(t, +el.dataset.mat);
if(f==='sealed') it.sealed = Math.min(Math.max(Math.round(v),0),9999);
else it.open = Math.min(Math.max(Math.round(v*100)/100,0),999);
} else if(k==='rec'){
const m = S.materials.find(x=>x.id===id); const r = m && m.records[+el.dataset.i]; if(!r) return;
if(f==='start'||f==='end') r[f] = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : '';
else if(f==='count') r.count = Math.round(v);
else r.bottles = v || 1;
} else if(k==='pick'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
const matId = +el.dataset.mat;
if(el.type==='checkbox'){
const has = m.lines.some(x=>x.matId===matId);
if(el.checked && !has){ const mt = S.materials.find(x=>x.id===matId); const sg = mt ? matSuggest(mt) : null; m.lines.push({matId, amount: sg==null ? 0 : sg}); }
else if(!el.checked && has) m.lines = m.lines.filter(x=>x.matId!==matId);
touch(); rerender(); return;
}
const l = m.lines.find(x=>x.matId===matId); if(l) l.amount = v;
} else if(k==='ex'){
const e = S.expenses.find(x=>x.id===id); if(!e) return;
if(f==='name') e.name = String(v).slice(0,60);
else if(f==='per') e.per = el.value==='y' ? 'y' : 'm';
else if(f==='goal') e.goal = el.value.trim()==='' ? null : v;
else e.amount = v;
} else if(k==='exOff'){
const gid = el.dataset.g;
S.exOff = S.exOff.filter(x=>x!==gid);
if(!el.checked) S.exOff.push(gid);
} else if(k==='trial'){
if(f==='minutes') S.trial.minutes = Math.min(v,1440); else S.trial.cost = v;
} else if(k==='menu'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
if(f==='name') m.name = String(v).slice(0,60);
else if(f==='minutes') m.minutes = Math.min(v,1440);
else m[f] = v;
} else if(k==='line'){
const m = S.menus.find(x=>x.id===id); const l = m && m.lines[+el.dataset.i]; if(!l) return;
if(f==='matId') l.matId = +el.value || 0; else l.amount = v;
} else if(k==='mat'){
const m = S.materials.find(x=>x.id===id); if(!m) return;
if(f==='name') m.name = String(v).slice(0,60);
else if(f==='unit') m.unit = String(v).slice(0,10);
else m[f] = v;
} else if(k==='coupon'){
const c = S.coupons.find(x=>x.id===id); if(!c) return;
if(f==='name') c.name = String(v).slice(0,60);
else if(f==='menuId') c.menuId = +el.value;
else if(f==='sessions') c.sessions = Math.min(Math.max(Math.round(v)||1,1),100);
else c[f] = v;
}
refreshLive(); touch();
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
// 入力欄から離れたとき、全角数字などを半角の数字に整える
document.addEventListener('focusout', (e)=>{
const el = e.target;
if(el.dataset && el.dataset.num && el.value.trim()!==''){
const n = parseNum(el.value);
el.value = n ? String(n) : '';
}
});

// ================= 操作 =================
function sampleData(){
// ネイルサロンの価格の例(購入者が自分の数字に書き換える前提のサンプル)
const d = defaultState();
d.settings = {hourly:2000, round:100, hours:80, payMode:'card', fee:2.5, place:0, tax:'none', taxRate:10, margin:30, costMax:20};
d.materials = [
{id:1,name:'ベースジェル',price:12800,qty:25,unit:'g',guide:0.25},
{id:2,name:'カラージェル',price:3200,qty:4,unit:'g',guide:0.5},
{id:3,name:'トップジェル',price:12800,qty:25,unit:'g',guide:0.4},
{id:4,name:'プレップ',price:2400,qty:1000,unit:'ml',guide:0.8},
{id:5,name:'クリーナー',price:2400,qty:1000,unit:'ml',guide:1},
{id:6,name:'耳つぼシール(貴宝石パワーシール小)',price:2240,qty:32,unit:'個',guide:0}];
d.materials.forEach(m=>{ m.samples = []; m.records = []; });
const gel = [{matId:1,amount:0.25},{matId:2,amount:0.5},{matId:3,amount:0.4},{matId:4,amount:0.8},{matId:5,amount:1}];
d.menus = [
{id:7,name:'ワンカラー(ハンド)',price:5500,market:0,minutes:90,other:0,count:34,lines:gel.map(x=>({...x}))},
{id:8,name:'フット',price:8000,market:0,minutes:90,other:0,count:17,lines:gel.map(x=>({...x}))},
{id:9,name:'耳つぼ6個',price:3300,market:0,minutes:30,other:0,count:52,lines:[{matId:6,amount:6}]}];
d.coupons = [];
d.expenses = [
{id:10,group:'rent',name:'家賃',amount:60000,per:'m',goal:null},
{id:11,group:'rent',name:'駐車場',amount:10000,per:'m',goal:null},
{id:12,group:'util',name:'水道光熱費(電気・水道・ガス)',amount:40000,per:'m',goal:null}];
d.exOff = ['mat'];
d.idc = 13;
return d;
}
function nextId(){ return S.idc++; }

function loadSample(){
S = sampleData(); touch(); saveNow(); tab = 'result'; render(); window.scrollTo(0,0);
msg('ok','サンプルを入れました。数字は説明用です。ご自身の数字に書き換えてください。');
}
function exportData(){
const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = `NailCost_${todayStr()}.json`;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url), 1000);
msg('ok','バックアップを保存しました。ダウンロードされたファイルを大切に保管してください。');
}

document.addEventListener('click', (e)=>{
const b = e.target.closest('[data-act]');
if(!b) return;
const act = b.dataset.act, id = +b.dataset.id;
if(act==='sample'){
if(hasData()) confirmBox('サンプルを入れますか?','いま入っている材料・メニュー・回数券・設定は、サンプルの内容に置き換わります。\n必要なら先にバックアップを保存してください。','置き換える', loadSample);
else loadSample();
}
else if(act==='addMenu'){ S.menus.push({id:nextId(),name:'',price:0,market:0,minutes:0,other:0,count:0,lines:[]}); touch(); rerender(); }
else if(act==='dupMenu'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
const c = JSON.parse(JSON.stringify(m)); c.id = nextId(); c.name = (m.name||'メニュー') + '(コピー)';
S.menus.splice(S.menus.indexOf(m)+1, 0, c); touch(); rerender();
}
else if(act==='delMenu'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
const nc = S.coupons.filter(c=>c.menuId===id).length;
confirmBox('このメニューを削除しますか?', `「${m.name||'(名前なし)'}」を削除します。${nc?`\nこのメニューの回数券${nc}件も削除されます。`:''}\nこの操作は元に戻せません。`, '削除する', ()=>{
S.menus = S.menus.filter(x=>x.id!==id); S.coupons = S.coupons.filter(c=>c.menuId!==id);
touch(); rerender();
});
}
else if(act==='addLine'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
if(!S.materials.length){ msg('warn','先に「材料」タブで材料を登録してください。'); window.scrollTo(0,0); return; }
m.lines.push({matId:S.materials[0].id, amount:0}); touch(); rerender();
}
else if(act==='delLine'){
const m = S.menus.find(x=>x.id===id); if(!m) return;
m.lines.splice(+b.dataset.i,1); touch(); rerender();
}
else if(act==='addEx'){
const g = b.dataset.g; if(!EX_IDS.includes(g)) return;
S.expenses.push({id:nextId(), group:g, name:b.dataset.n||'', amount:0, per:'m', goal:null}); touch(); rerender();
}
else if(act==='delEx'){
const e = S.expenses.find(x=>x.id===id); if(!e) return;
S.expenses = S.expenses.filter(x=>x.id!==id); touch(); rerender();
}
else if(act==='goTab'){ stkSel = null; setTab(b.dataset.t); }
else if(act==='stkNew'){
if(!S.materials.length){ msg('warn','先に「材料」タブで材料を登録してください。'); window.scrollTo(0,0); return; }
const d = /^\d{4}-\d{2}-\d{2}$/.test(b.dataset.d) ? b.dataset.d : todayStr();
const ex = S.stocks.find(x=>x.date===d);
if(ex){ stkSel = ex.id; msg('ok',`${dateJP(d)}の棚卸はすでにあるので、それを開きました。`); render(); window.scrollTo(0,0); return; }
const t = {id:nextId(), date:d, locked:false, items:[]};
const prev = stkPrev(t);
S.stocks.push(t); stkSel = t.id; touch(); render(); window.scrollTo(0,0);
msg('ok', prev ? `棚卸をはじめました。前回(${dateJP(prev.date)})の数と比べて表示します。` : '棚卸をはじめました。');
}
else if(act==='stkOpenT'){ stkSel = id; msg('',''); render(); window.scrollTo(0,0); }
else if(act==='stkClose'){ stkSel = null; msg('',''); render(); window.scrollTo(0,0); }
else if(act==='stkStep' || act==='stkOpen'){
const t = S.stocks.find(x=>x.id===id); if(!t || t.locked) return;
const it = stkItem(t, +b.dataset.mat), v = parseFloat(b.dataset.v)||0;
if(act==='stkStep') it.sealed = Math.min(Math.max(it.sealed + v, 0), 9999);
else it.open = v===0 ? 0 : Math.min(Math.round((it.open + v)*100)/100, 999);
touch(); rerender();
}
else if(act==='stkLock'){
const t = S.stocks.find(x=>x.id===id); if(!t) return;
const noPrice = S.materials.filter(m=>!(m.price>0)).length;
confirmBox('この棚卸を確定しますか?', `${dateJP(t.date)}の棚卸を、今の購入金額で確定します。\n確定後は、材料の金額を変えてもこの棚卸の金額は変わりません。${noPrice?`\n購入金額が入っていない材料が${noPrice}件あります(0円で計算されます)。`:''}`, '確定する', ()=>{
t.items = S.materials.map(m=>{ const it = t.items.find(x=>x.matId===m.id) || {sealed:0, open:0}; return {matId:m.id, sealed:it.sealed, open:it.open, name:m.name, price:m.price, qty:m.qty, unit:m.unit}; });
t.locked = true; touch(); rerender(); msg('ok','確定しました。CSVで保存しておくと、確定申告のときに便利です。');
});
}
else if(act==='stkUnlock'){
const t = S.stocks.find(x=>x.id===id); if(!t) return;
confirmBox('確定を解除しますか?', '解除すると、金額は今の材料の購入金額で計算し直されます。\n削除した材料は一覧から外れます。', '解除する', ()=>{ t.locked = false; t.items = t.items.filter(it=>S.materials.some(m=>m.id===it.matId)); touch(); rerender(); });
}
else if(act==='stkDel'){
const t = S.stocks.find(x=>x.id===id); if(!t) return;
confirmBox('この棚卸を削除しますか?', `${dateJP(t.date)}の棚卸を削除します。\nこの操作は元に戻せません。`, '削除する', ()=>{ S.stocks = S.stocks.filter(x=>x.id!==id); stkSel = null; touch(); render(); window.scrollTo(0,0); });
}
else if(act==='stkCsv'){ const t = S.stocks.find(x=>x.id===id); if(t){ stkCsv(t); msg('ok','CSVを保存しました。'); } }
else if(act==='hideGuide'){ S.hideGuide = true; touch(); rerender(); }
else if(act==='showGuide'){ S.hideGuide = false; touch(); setTab('result'); }
else if(act==='addRec'){
const m = S.materials.find(x=>x.id===id); if(!m||m.records.length>=50) return;
m.records.push({start:'', end:todayStr(), count:0, bottles:1}); touch(); rerender();
}
else if(act==='delRec'){
const m = S.materials.find(x=>x.id===id); if(!m) return;
m.records.splice(+b.dataset.i,1); touch(); rerender();
}
else if(act==='addSample'){
const m = S.materials.find(x=>x.id===id); const inp = $('#smp_'+id); if(!m||!inp) return;
const v = parseNum(inp.value);
if(v>0 && m.samples.length<50){ m.samples.push(v); touch(); rerender(); } else { inp.focus(); }
}
else if(act==='delSample'){
const m = S.materials.find(x=>x.id===id); if(!m) return;
m.samples.splice(+b.dataset.i,1); touch(); rerender();
}
else if(act==='useGuide'){
const m = S.menus.find(x=>x.id===id); const mt = S.materials.find(x=>x.id===+b.dataset.mat); const l = m&&m.lines.find(x=>x.matId===+b.dataset.mat);
if(!l||!mt) return;
const v = matSuggest(mt); if(v!=null){ l.amount = v; touch(); rerender(); }
}
else if(act==='addMat'){ S.materials.push({id:nextId(),name:b.dataset.n||'',price:0,qty:0,unit:b.dataset.u||'',guide:parseNum(b.dataset.g),records:[],samples:[]}); touch(); rerender(); }
else if(act==='delMat'){
const m = S.materials.find(x=>x.id===id); if(!m) return;
const used = S.menus.filter(x=>x.lines.some(l=>l.matId===id)).length;
confirmBox('この材料を削除しますか?', `「${m.name||'(名前なし)'}」を削除します。${used?`\n使っている${used}件のメニューから、この材料が外れます(材料費が下がります)。`:''}\nこの操作は元に戻せません。`, '削除する', ()=>{
S.materials = S.materials.filter(x=>x.id!==id);
S.menus.forEach(x=>{ x.lines = x.lines.filter(l=>l.matId!==id); });
touch(); rerender();
});
}
else if(act==='addCoupon'){
if(!S.menus.length) return;
S.coupons.push({id:nextId(),name:'',menuId:S.menus[0].id,sessions:4,price:0}); touch(); rerender();
}
else if(act==='delCoupon'){
const c = S.coupons.find(x=>x.id===id); if(!c) return;
confirmBox('この回数券を削除しますか?', `「${c.name||'(名前なし)'}」を削除します。\nこの操作は元に戻せません。`, '削除する', ()=>{
S.coupons = S.coupons.filter(x=>x.id!==id); touch(); rerender();
});
}
else if(act==='export'){ exportData(); }
else if(act==='import'){ $('#importFile').click(); }
else if(act==='clearAll'){
confirmBox('全データを消去しますか?','設定・材料・メニュー・回数券・棚卸をすべて消去します。\nこの操作は元に戻せません。先にバックアップを保存してください。','消去する', ()=>{
S = defaultState(); touch(); saveNow(); tab='set'; render(); window.scrollTo(0,0); msg('ok','全データを消去しました。');
});
}
});

document.addEventListener('change', async (e)=>{
if(e.target.id!=='importFile') return;
const file = e.target.files[0];
e.target.value = '';
if(!file) return;
let clean;
try{ clean = sanitize(JSON.parse(await file.text())); }
catch(err){ msg('bad','読み込みに失敗しました。このアプリで保存したJSONファイルを選んでください。'); window.scrollTo(0,0); return; }
const apply = ()=>{ S = clean; touch(); saveNow(); tab='result'; render(); window.scrollTo(0,0); msg('ok',`読み込みました(材料${S.materials.length}件・メニュー${S.menus.length}件・回数券${S.coupons.length}件・棚卸${S.stocks.length}件)。`); };
if(hasData()) confirmBox('読み込んだ内容に置き換えますか?','いま入っているデータは、読み込むファイルの内容に置き換わります。\n必要なら先にバックアップを保存してください。','置き換える', apply);
else apply();
});

// ================= 起動 =================
(function init(){
try{
const raw = localStorage.getItem(KEY);
if(raw){ S = sanitize(JSON.parse(raw)); setStatus('前回のデータを復元しました'); }
else setStatus('入力内容は自動で保存されます');
}catch(err){
S = defaultState();
storageOK = false;
setStatus('⚠ この環境では自動保存が使えません。バックアップを保存してください', true);
}
render();
})();
</script>
